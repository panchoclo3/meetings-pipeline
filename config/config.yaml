# =============================================================================
# Configuración central del pipeline "Segundo Cerebro"
# =============================================================================
# Este archivo es la ÚNICA fuente de verdad para el vocabulario controlado
# (proyectos, tags) y los parámetros de cada herramienta. Editarlo aquí
# se propaga automáticamente al prompt de extracción y a las propiedades
# de Notion. No dupliques estas listas en otro lugar.

# -----------------------------------------------------------------------------
# Vocabulario controlado — evita que Claude invente variantes del mismo tag
# (ej: "ergonomia" vs "ergonomía" vs "diseño ergonómico"). Edita estas listas
# cuando necesites un proyecto o tag nuevo; el pipeline las usa como referencia
# obligatoria en el prompt de extracción.
#
# Nota: "proyectos" solo aplica a la base Reuniones (ver propiedades_reuniones
# más abajo). La base Tareas ya no tiene campo Proyecto — todas sus tareas
# son de Ventana Celeste por definición.
# -----------------------------------------------------------------------------
proyectos:
  - "Ventana Celeste"
  - "Tesis"
  - "Personal"
  - "Otro"

tags_permitidos:
  - "ergonomia"
  - "software"
  - "hardware"
  - "sensores"
  - "MIM"
  - "prototipo-autonomo"
  - "prototipo-mediado"
  - "prototipo-hogar"
  - "prototipo-escolar"
  - "github-pages"
  - "diseño-ux"
  - "presupuesto"
  - "testing-usuarios"
  - "stellarium"
  - "protobject"
  - "arduino"
  - "fusion360"

tipos_reunion:
  - "reunion_proyecto"
  - "conversacion_profesor"
  - "brainstorming"
  - "espontanea"

# Vocabulario compartido por Tareas y Decisiones (select simple). La base
# Ideas usa una lista distinta (prototipos_ideas más abajo) porque ahí el
# campo es multi-select e incluye "Estacion nueva".
prototipos_permitidos:
  - "Autonomo"
  - "Mediado"
  - "Escolar"
  - "Hogar"
  - "Transversal"

prototipos_ideas:
  - "Autonomo"
  - "Mediado"
  - "Escolar"
  - "Hogar"
  - "Estacion nueva"
  - "Transversal"

# Disciplina del trabajo en Tareas. Ortogonal a Prototipo — NUNCA mezclar
# (ej: "Autonomo" no es un Área, es un Prototipo; error histórico frecuente
# en este proyecto, ver README).
areas_permitidas:
  - "Diseño"
  - "Fabricacion"
  - "Electronica"
  - "Software"
  - "Difusion"
  - "Administrativo"
  - "Investigacion"

# Vocabulario controlado de personas — usado como referencia obligatoria en
# el prompt de extracción para el campo "responsable" de cada tarea (acepta
# cero, uno o más nombres de esta lista). Debe reflejar los mismos nombres
# que se usan en Reuniones.Personas. Edita esta lista si se suma o se va
# alguien del equipo; también actualiza notion.resolucion_personas más abajo.
personas_permitidas:
  - "Francisco"
  - "Alessio"
  - "Gonzalo"
  - "Valeria"
  - "Fernanda"
  - "Patricio"

# -----------------------------------------------------------------------------
# Diarización / ASR — WhisperX (motor gratuito, local)
# -----------------------------------------------------------------------------
whisperx:
  model: "large-v3-turbo"        # MODIFICADO por rendiemiento de cpu Acer Aspire 5
  language: "es"
  device: "cpu"             # cambiar a "cuda" si hay GPU NVIDIA disponible
  compute_type: "int8"      # "int8" en CPU, "float16" en GPU
  batch_size: 8
  diarization: true
  hf_token_env: "HF_TOKEN"  # nombre de la variable de entorno con el token de HuggingFace

# -----------------------------------------------------------------------------
# Extracción estructurada — Claude
# -----------------------------------------------------------------------------
claude:
  model: "claude-sonnet-4-6"
  max_tokens: 16000
  temperature: 0.2   # baja: queremos extracción fiel, no creatividad

# -----------------------------------------------------------------------------
# Notion — IDs de las bases de datos
# -----------------------------------------------------------------------------
# Los IDs reales NO se guardan acá (este archivo se versiona en git) — cada
# clave apunta al nombre de la variable de entorno en .env que sí los tiene,
# mismo patrón que whisperx.hf_token_env más abajo.
notion:
  reuniones_database_id_env: "NOTION_REUNIONES_DATABASE_ID"  # página "Reuniones"
  tareas_database_id_env: "NOTION_TAREAS_DATABASE_ID"        # página "Tareas del equipo"
  ideas_database_id_env: "NOTION_IDEAS_DATABASE_ID"          # página "Ideas"
  # Nombre exacto de las propiedades en Notion (deben coincidir con el esquema
  # real de tus bases; si les cambias el nombre en Notion, actualízalo aquí)
  propiedades_reuniones:
    titulo: "Agenda"
    fecha: "Fecha"
    proyecto: "Proyecto"
    personas: "Personas"
    tags: "Tags"
    tipo: "Tipo"
    estado: "Estado"
  propiedades_tareas:
    titulo: "Nombre"
    # Campo "Responsable" (person, tipo usuario real de Notion). Puede tener
    # más de una persona asignada — es un array de user IDs, no un select
    # único. El campo "Responsable (IA)" (select) queda deprecado: ya no se
    # usa desde el pipeline.
    responsable: "Responsable"
    prototipo: "Prototipo"
    # Disciplina del trabajo — ORTOGONAL a "Prototipo", nunca mezclar (ver
    # areas_permitidas más arriba y README).
    area: "Área"
    prioridad: "Prioridad"
    estado: "Estado"
    fecha: "Fecha"
    reunion_origen: "Reunion origen"
    # Campo de texto libre en la base Tareas. Se usa para dejar constancia
    # cuando un nombre extraído no pudo resolverse a un user ID de Notion
    # (ver notion.resolucion_personas y scripts/07_aplicar_cambios.py::resolver_persona).
    # Confirmado contra el schema real vía API: existe como propiedad "text".
    notas: "Notas"
    # Self-relation obligatoria: toda tarea nueva cuelga de una épica (ver
    # notion.epicas más abajo). Se escribe SIEMPRE desde el lado hijo
    # (la tarea) — setear esto en la épica no rellena el lado inverso, ver
    # scripts/07_aplicar_cambios.py.
    tarea_madre: "Tarea madre"
    subtareas: "Subtareas"
  # Mapeo nombre → user ID real de Notion, usado para resolver el campo
  # "Responsable" (person) a partir de los nombres en texto libre que
  # extrae el pipeline del audio. Deja `null` si no tienes el ID — el
  # pipeline intentará resolverlo vía API (/v1/users) como respaldo
  # automático, y si tampoco lo encuentra ahí (típico de invitados sin
  # acceso completo a la integración), lo dejará como no resuelto sin fallar.
  #
  # IDs obtenidos el 2026-08-12 vía búsqueda de usuarios de la API de Notion
  # (query_type=user) y, donde fue posible, cruzados contra el campo
  # "Responsable" de tareas ya existentes en la base Kanban real:
  # - Francisco: confirmado por /v1/users (miembro completo del workspace).
  # - Gonzalo: confirmado dos veces — búsqueda de usuario Y una tarea real
  #   cuyo título menciona "de Gonzalo" tiene este mismo ID asignado.
  # - Patricio, Alessio: confirmados por búsqueda de usuario (nombre+email
  #   coinciden) y aparecen usados en tareas reales de la base, pero sin una
  #   pista textual tan directa como la de Gonzalo — confianza alta, no
  #   verificación cruzada perfecta.
  # - Valeria: encontrada por búsqueda de usuario (nombre "VALERIA LÓPEZ" +
  #   email uc.cl), pero este ID NO aparece asignado a ninguna tarea
  #   existente en Notion — no hay forma de cruzarlo. Confianza media.
  # - Fernanda: en Notion aparece como "Fer Rojas" (no "Fernanda"), por eso
  #   la búsqueda inicial por "Fernanda" no la encontró. Confirmado por el
  #   usuario y verificado vía API buscando "Fer Rojas": mismo ID que ya
  #   aparecía en la tarea real "Prueba tecnica" junto a Patricio.
  resolucion_personas:
    Francisco: "24bd872b-594c-81d6-bccc-0002620e0c90"
    Alessio: "1acd872b-594c-8103-8eca-0002cb3d2129"
    Gonzalo: "ade4963a-69af-4d79-8250-d742bb968fba"
    Valeria: "bb5abeec-8ed1-456f-aeba-3fe6e1ac6516"
    Fernanda: "39dd872b-594c-810a-a3d8-00028749fa09"
    Patricio: "3a3d872b-594c-816b-bd43-000294d0fcba"
  # Base "Decisiones de diseño" — el pipeline la lee (comparación en el paso
  # 6) y escribe en ella automáticamente en el paso 7 (scripts/07_aplicar_cambios.py).
  decisiones_database_id_env: "NOTION_DECISIONES_DATABASE_ID"
  propiedades_decisiones:
    decision: "Decision"
    tema: "Tema"
    razon: "Razon"
    # "Estado" describe VIGENCIA, nunca avance de implementación:
    # Vigente = rige hoy | Tentativa = acordada pero no confirmada |
    # Superada = reemplazada por otra (ver reemplazada_por) |
    # Revertida = se deshizo sin reemplazo. El trabajo pendiente de una
    # decisión Vigente vive en "tareas_implementacion", nunca en este campo.
    estado: "Estado"
    prototipo: "Prototipo" # select: Autonomo | Mediado | Escolar | Hogar | Transversal
    fecha: "Fecha"
    reunion_origen: "Reunion origen"
    # Self-relation: toda decisión nueva cuelga de una de las 4 decisiones
    # madre (ver notion.decisiones_madre). Se escribe desde el lado hijo.
    decision_madre: "Decision madre"
    sub_decisiones: "Sub-decisiones"
    # Cuando el equipo cambia de opinión: la decisión anterior se marca
    # Superada y "reemplazada_por" apunta a la nueva (lado hijo = la
    # anterior). Nunca se sobrescribe una decisión existente.
    reemplazada_por: "Reemplazada por"
    reemplaza_a: "Reemplaza a"
    tareas_implementacion: "Tareas de implementacion"

  # Base "Ideas" — propuestas sin compromiso, nivel más bajo del pipeline
  # Reunión → Idea → Decisión → Tarea. No tiene relation a Reuniones (el
  # esquema real solo trae "Origen" como texto libre).
  propiedades_ideas:
    idea: "Idea"
    estado: "Estado"                       # Propuesta | En discusion | Aprobada | Descartada | Congelada
    horizonte: "Horizonte"                 # Ahora | V2 MIM | Feria | Futuro | Congelada
    encaje_filosofico: "Encaje filosofico" # Refuerza | Neutro | Tensiona
    prototipo: "Prototipo"                 # multi_select, ver prototipos_ideas
    origen: "Origen"                       # texto libre, no relation
    esfuerzo: "Esfuerzo"                   # Bajo | Medio | Alto | Muy alto
    problema_que_resuelve: "Problema que resuelve"

  # Catálogo cerrado de épicas — toda tarea nueva cuelga de una de estas.
  # Si de verdad ninguna encaja, el pipeline NO crea una épica nueva por su
  # cuenta (ver README) — la tarea queda "pendiente" para que la agregues acá
  # a mano después de crearla en Notion. IDs obtenidos el 2026-08-19 vía
  # notion-query-data-sources (WHERE "Tarea madre" IS NULL).
  epicas:
    AUT-1:
      id: "3c6dc87921a181948c65cde8f3c2ac40"
      nombre: "Forma física final del Autónomo (V2 itinerante)"
    AUT-2:
      id: "3c7dc87921a18109be5bfee52b5217a6"
      nombre: "Electrónica y alimentación segura del Autónomo"
    AUT-3:
      id: "3c7dc87921a1817d9639ffbfd57ee805"
      nombre: "Software del Autónomo (estabilidad y ferias)"
    MED-1:
      id: "3c7dc87921a181caa5a5d7485959a9fb"
      nombre: "Cerrar hardware óptico del Mediado"
    MED-2:
      id: "3c7dc87921a181e3948ed85417dd6ca5"
      nombre: "Software e integración del Mediado"
    DIF-1:
      id: "3c7dc87921a181fbb05dfb642558347b"
      nombre: "Feria de ingeniería e innovación"
    DIF-2:
      id: "3c7dc87921a1811ca45ad7019c1397d9"
      nombre: "Alianza CATA"
    DIF-3:
      id: "3badc87921a181b48bd5d53b5a398f24"
      nombre: "Plan de divulgación"
    INF-1:
      id: "3c7dc87921a1812e87b0df032c2b6a47"
      nombre: "Infraestructura y accesos del equipo"
    ADM-1:
      id: "3c7dc87921a18178aef8e1463e7ac663"
      nombre: "Salidas y visitas del equipo"

  # Catálogo cerrado de decisiones madre — toda decisión nueva cuelga de una
  # de estas 4. Mismos IDs obtenidos el 2026-08-19.
  decisiones_madre:
    D1:
      id: "3c7dc87921a1816ba3abc740d50b75d9"
      nombre: "Arquitectura física del Autónomo — forma, eje, alcance de fabricación"
    D2:
      id: "3c7dc87921a181ed810df764d76aea33"
      nombre: "Modalidad de visualización del Autónomo — dispositivo y formato"
    D3:
      id: "3c7dc87921a1810d9e9ec200d3c65e14"
      nombre: "Modelo de interacción y zoom — navegación del cielo"
    D4:
      id: "3c7dc87921a18100b1f3c7b61e11393c"
      nombre: "Estrategia de despliegue y validación — dónde se prueba, dónde se muestra"

# -----------------------------------------------------------------------------
# Resumen semanal (scripts/05_weekly_digest.py) — se escribe como bloque
# nuevo al final de una subpágina de Notion, nunca modifica lo ya escrito.
# -----------------------------------------------------------------------------
resumen_semanal:
  pagina_padre: "Ventana Celeste"       # página existente bajo la cual vive el resumen
  pagina_resumenes: "Resúmenes semanales"  # subpágina donde se acumulan los resúmenes; se crea si no existe

# -----------------------------------------------------------------------------
# Rutas locales (relativas a la raíz del proyecto)
# -----------------------------------------------------------------------------
paths:
  audio_dir: "data/audio"
  transcripts_dir: "data/transcripts"
  staging_dir: "data/staging"
  processed_dir: "data/processed"